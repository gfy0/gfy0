name: Cloud suggestion review and publication
on:
  issues:
    types: [opened, edited, reopened]
  schedule:
    - cron: '35 * * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing suggestion number to recover; leave empty to check queue
        required: false
        type: string
permissions: {}
concurrency:
  group: your-no1-cloud-directory
  cancel-in-progress: false
jobs:
  review:
    if: github.repository == 'gfy0/gfy0' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: https://gfy0.github.io/gfy0/
    permissions:
      contents: write
      issues: write
      pages: write
      id-token: write
    steps:
      - name: Read trusted automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          path: automation
          persist-credentials: false
      - name: Read existing website
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/your-no1-pages
          path: site
          persist-credentials: false
      - name: Verify review boundaries
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify review and recovery boundaries
        run: node --test automation/scripts/cloud-suggestion-review.test.mjs automation/scripts/cloud-source-review.test.mjs
      - name: Review and persist accepted project profiles
        id: prepare
        run: node automation/scripts/cloud-suggestion-review.mjs prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_DIRECTORY: ${{ github.workspace }}/site
      - name: Upload website
        if: steps.prepare.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: site
          retention-days: 1
      - name: Publish website
        if: steps.prepare.outputs.deploy == 'true'
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Confirm live listing or save recovery result
        if: always()
        run: node automation/scripts/cloud-suggestion-review.mjs finish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_DIRECTORY: ${{ github.workspace }}/site
          DEPLOY_RESULT: ${{ steps.deploy.outcome }}
