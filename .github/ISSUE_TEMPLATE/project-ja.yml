{
  "name": "プロジェクトを公開で提案 (ja)",
  "description": "無料ディレクトリにプロジェクトを提案します。アカウント情報と内容は公開されます。",
  "title": "[Project suggestion] ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "GitHubへのログインが必要です。GitHub上のあなたのアカウント情報と提案内容は公開されます。個人情報、機密情報、支払い情報を入力しないでください。\n\nこれは検討用の公開提案であり、匿名投稿や非公開の受付票ではありません。自動審査は開始されず、掲載も保証されません。料金はかかりません。\n\nIssueのURLを保存すると、オープン・クローズの状態や返信を確認できます。提案はGitHubで編集できます。送信に失敗した場合は、重複を避けるため先に記録が作成されていないか確認してください。"
      }
    },
    {
      "type": "input",
      "id": "project-name",
      "attributes": {
        "label": "プロジェクト名"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "official-url",
      "attributes": {
        "label": "公式の公開URL",
        "placeholder": "https://example.org/"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "reason",
      "attributes": {
        "label": "このプロジェクトのどんな点を紹介したいですか？"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "checkboxes",
      "id": "public-disclosure",
      "attributes": {
        "label": "プロジェクトを公開で提案",
        "options": [
          {
            "label": "GitHub上のアカウント情報とこの内容が公開されることを理解し、個人情報、機密情報、支払い情報を含めていません。",
            "required": true
          }
        ]
      }
    }
  ]
}
