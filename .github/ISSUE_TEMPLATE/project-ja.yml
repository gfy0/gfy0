{
  "name": "プロジェクトを公開で提案 (ja)",
  "description": "無料ディレクトリにプロジェクトを提案します。アカウント情報と内容は公開されます。",
  "title": "[Project suggestion] ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "GitHubへのログインが必要です。GitHub上のあなたのアカウント情報と提案内容は公開されます。個人情報、機密情報、支払い情報を入力しないでください。\n\n投稿または編集するとクラウドで確認を開始します。同じ記録を保存して結果を確認してください。料金はかかりません。\n\n審査は運営者のパソコンを使わずクラウドで実行します。対応するオープンソースライセンスがある、GitHub 組織管理の公開リポジトリを提案できます。README 全文は20,000文字以内で、プロジェクト名と用途を述べた短い原文の行が必要です。リスク、不確実性、確認できない点がある場合は掲載しません。出典が変わると承認を停止します。GitHub の稼働状況に依存し、処理時間や掲載は保証しません。 投稿はすぐに保存されます。定期審査は毎時最大1件で、順番待ちや GitHub の遅延により長くかかる場合があります。短い出典の説明は英語で記載されている必要があります。審査に失敗したら、同じ投稿を編集して再度審査待ちにできます。\n\n審査対象の開発ツール:\n- コードフォーマッター\n- ソースコードのリンター\n- 型チェッカー\n- コンパイラー\n\nページ公開後にのみ掲載を確定します。公開に失敗するとクラウドの復旧処理が再試行します。重複投稿は不要です。"
      }
    },
    {
      "type": "input",
      "id": "project-name",
      "attributes": {
        "label": "プロジェクト名"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "official-url",
      "attributes": {
        "label": "公式の公開URL",
        "placeholder": "https://github.com/organization/project"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "reason",
      "attributes": {
        "label": "このプロジェクトのどんな点を紹介したいですか？"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "checkboxes",
      "id": "public-disclosure",
      "attributes": {
        "label": "プロジェクトを公開で提案",
        "options": [
          {
            "label": "GitHub上のアカウント情報とこの内容が公開されることを理解し、個人情報、機密情報、支払い情報を含めていません。",
            "required": true
          }
        ]
      }
    },
    {
      "type": "checkboxes",
      "id": "not-listed",
      "attributes": {
        "label": "先にディレクトリを確認",
        "description": "https://gfy0.github.io/gfy0/ja/discover/",
        "options": [
          {
            "label": "ディレクトリを検索し、同じプロジェクトが掲載されていないことを確認しました。",
            "required": true
          }
        ]
      }
    }
  ]
}
