{
  "name": "プロジェクトを公開で提案 (ja)",
  "description": "無料ディレクトリにプロジェクトを提案します。アカウント情報と内容は公開されます。",
  "title": "[Project suggestion] ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "GitHubへのログインが必要です。GitHub上のあなたのアカウント情報と提案内容は公開されます。個人情報、機密情報、支払い情報を入力しないでください。\n\n投稿または編集するとクラウドで確認を開始します。同じ記録を保存して結果を確認してください。料金はかかりません。\n\n審査は運営者のパソコンを起動せずにクラウドで実行されます。新規自動掲載は、以下の事前確認済みの出典のみが対象です。他の出典には未掲載の結果を返します。一般的なプロジェクト審査には対応していません。確認済みの版が変わると自動承認を停止します。GitHub の稼働状況に依存し、処理時間は保証しません。\n\n自動掲載の対象となる出典:\n- ESLint: https://github.com/eslint/eslint\n- Prettier: https://github.com/prettier/prettier\n- TypeScript: https://github.com/microsoft/TypeScript\n\nページ公開後にのみ掲載を確定します。公開に失敗するとクラウドの復旧処理が再試行します。重複投稿は不要です。"
      }
    },
    {
      "type": "input",
      "id": "project-name",
      "attributes": {
        "label": "プロジェクト名"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "official-url",
      "attributes": {
        "label": "公式の公開URL",
        "placeholder": "https://example.org/"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "reason",
      "attributes": {
        "label": "このプロジェクトのどんな点を紹介したいですか？"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "checkboxes",
      "id": "public-disclosure",
      "attributes": {
        "label": "プロジェクトを公開で提案",
        "options": [
          {
            "label": "GitHub上のアカウント情報とこの内容が公開されることを理解し、個人情報、機密情報、支払い情報を含めていません。",
            "required": true
          }
        ]
      }
    },
    {
      "type": "checkboxes",
      "id": "not-listed",
      "attributes": {
        "label": "先にディレクトリを確認",
        "description": "https://gfy0.github.io/gfy0/ja/discover/",
        "options": [
          {
            "label": "ディレクトリを検索し、同じプロジェクトが掲載されていないことを確認しました。",
            "required": true
          }
        ]
      }
    }
  ]
}
