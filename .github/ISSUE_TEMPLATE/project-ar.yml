{
  "name": "اقتراح مشروع بشكل علني (ar)",
  "description": "اقترح مشروعًا للدليل المجاني. الهوية والمحتوى علنيان.",
  "title": "[Project suggestion] ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "يلزم تسجيل الدخول إلى GitHub. ستظهر هويتك على GitHub ومحتوى اقتراحك للعامة. لا تدرج معلومات شخصية أو سرية أو معلومات دفع.\n\nيبدأ إرسال الاقتراح أو تعديله التحقق السحابي. احتفظ بالسجل نفسه لعرض النتيجة. لا توجد رسوم.\n\nتعمل المراجعة في السحابة دون حاسوب المشغّل. يمكنك اقتراح مستودعات عامة تديرها مؤسسات GitHub وتحمل ترخيصًا مفتوح المصدر مدعومًا. يجب ألا يتجاوز ملف README الكامل 20,000 محرف، وأن يتضمن سطرًا نصيًا قصيرًا يذكر اسم المشروع وغرضه. لا تُدرج المشاريع الخطرة أو غير المؤكدة أو التي يتعذر التحقق منها. يوقف تغير المصدر القبول. تعتمد المعالجة على توفر GitHub ولا نضمن موعدًا أو إدراجًا. تُحفظ الاقتراحات فورًا. تراجع المهمة السحابية المجدولة مشروعًا جديدًا واحدًا كحد أقصى كل ساعة؛ وقد تطول المدة بسبب الانتظار أو تأخر GitHub. يجب أن يكون وصف المصدر القصير باللغة الإنجليزية. إذا فشلت المراجعة، عدّل الاقتراح نفسه لإعادته إلى قائمة الانتظار.\n\nأدوات التطوير المدعومة:\n- أدوات تنسيق الشيفرة\n- أدوات فحص الشيفرة المصدرية\n- أدوات التحقق من الأنواع\n- المُصرّفات\n\nلا يتأكد الإدراج إلا بعد نشر صفحة المشروع. تعيد مهمة سحابية محاولة النشر عند الفشل؛ لا ترسل اقتراحًا مكررًا."
      }
    },
