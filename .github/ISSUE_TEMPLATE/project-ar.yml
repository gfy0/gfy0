{
  "name": "اقتراح مشروع بشكل علني (ar)",
  "description": "اقترح مشروعًا للدليل المجاني. الهوية والمحتوى علنيان.",
  "title": "[Project suggestion] ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "يلزم تسجيل الدخول إلى GitHub. ستظهر هويتك على GitHub ومحتوى اقتراحك للعامة. لا تدرج معلومات شخصية أو سرية أو معلومات دفع.\n\nيبدأ إرسال الاقتراح أو تعديله التحقق السحابي. احتفظ بالسجل نفسه لعرض النتيجة. لا توجد رسوم.\n\nتعمل المراجعة في السحابة دون الحاجة إلى تشغيل حاسوب المشغّل. يقتصر الإدراج الآلي على المصادر المحددة التي روجعت مسبقًا أدناه. تحصل المصادر الأخرى على نتيجة عدم الإدراج؛ لا تتوفر مراجعة عامة للمشاريع. يتوقف القبول إذا تغيّرت النسخة المراجعة. تعتمد المعالجة على توفر GitHub ولا نضمن وقتًا محددًا.\n\nالمصادر المؤهلة للإدراج الآلي:\n- ESLint: https://github.com/eslint/eslint\n- Prettier: https://github.com/prettier/prettier\n- TypeScript: https://github.com/microsoft/TypeScript\n\nلا يتأكد الإدراج إلا بعد نشر صفحة المشروع. تعيد مهمة سحابية محاولة النشر عند الفشل؛ لا ترسل اقتراحًا مكررًا."
      }
    },
