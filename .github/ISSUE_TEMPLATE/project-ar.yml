{
  "name": "اقتراح مشروع بشكل علني (ar)",
  "description": "اقترح مشروعًا للدليل المجاني. الهوية والمحتوى علنيان.",
  "title": "[Project suggestion] ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "يلزم تسجيل الدخول إلى GitHub. ستظهر هويتك على GitHub ومحتوى اقتراحك للعامة. لا تدرج معلومات شخصية أو سرية أو معلومات دفع.\n\nينشئ هذا اقتراحًا عامًا للنظر فيه، وليس إرسالًا مجهول الهوية أو إيصالًا خاصًا. لا يبدأ الإرسال مراجعة فورية ولا يضمن النشر. لا تُطلب أي دفعة مالية.\n\nاحتفظ برابط المشكلة للاطلاع على حالتها المفتوحة أو المغلقة والردود. يمكنك تعديل اقتراحك على GitHub. إذا فشل الإرسال، تحقق أولًا من وجود السجل لتجنب التكرار.\n\nيفحص الإيصال الآلي الحقول المطلوبة وروابط المصادر المطابقة الموجودة في الدليل، ولا يعني قبول المحتوى. عدّل الاقتراح نفسه لتحديث الإيصال.\n\nتُراجع الاقتراحات على دفعات محدودة. تحدد نتيجة منفصلة النسخة المراجعة وتربط بالمشروع عند إدراجه. لا نضمن موعدًا للرد أو الإدراج."
      }
    },
    {
