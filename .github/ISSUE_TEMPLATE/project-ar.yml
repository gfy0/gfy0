{
  "name": "اقتراح مشروع بشكل علني (ar)",
  "description": "اقترح مشروعًا للدليل المجاني. الهوية والمحتوى علنيان.",
  "title": "[Project suggestion] ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "يلزم تسجيل الدخول إلى GitHub. ستظهر هويتك على GitHub ومحتوى اقتراحك للعامة. لا تدرج معلومات شخصية أو سرية أو معلومات دفع.\n\nينشئ هذا اقتراحًا عامًا للنظر فيه، وليس إرسالًا مجهول الهوية أو إيصالًا خاصًا. لا يبدأ مراجعة آلية ولا يضمن النشر. لا تُطلب أي دفعة مالية.\n\nاحتفظ برابط المشكلة للاطلاع على حالتها المفتوحة أو المغلقة والردود. يمكنك تعديل اقتراحك على GitHub. إذا فشل الإرسال، تحقق أولًا من وجود السجل لتجنب التكرار."
      }
    },
    {
      "type": "input",
      "id": "project-name",
      "attributes": {
        "label": "اسم المشروع"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "official-url",
      "attributes": {
        "label": "الرابط الرسمي العام",
        "placeholder": "https://example.org/"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "reason",
      "attributes": {
        "label": "لماذا يستحق هذا المشروع الاكتشاف؟"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "checkboxes",
      "id": "public-disclosure",
      "attributes": {
        "label": "اقتراح مشروع بشكل علني",
        "options": [
          {
            "label": "أفهم أن هويتي على GitHub وهذا المحتوى سيظهران للعامة، ولم أدرج معلومات شخصية أو سرية أو معلومات دفع.",
            "required": true
          }
        ]
      }
    }
  ]
}
