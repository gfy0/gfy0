{
  "name": "Sugerir un proyecto públicamente (es)",
  "description": "Sugiere un proyecto para el directorio gratuito. La identidad y el contenido son públicos.",
  "title": "[Project suggestion] ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Debes iniciar sesión en GitHub. Tu identidad de GitHub y tu sugerencia serán públicas. No incluyas datos personales, confidenciales ni de pago.\n\nEnviar o editar una sugerencia inicia las comprobaciones en la nube. Conserva el mismo registro para ver el resultado. No se cobra.\n\nLa revisión se ejecuta en la nube sin el ordenador del operador. Puedes sugerir repositorios públicos de organizaciones de GitHub con una licencia de código abierto admitida. El README completo debe tener como máximo 20.000 caracteres e incluir una breve línea de texto que nombre el proyecto y describa su finalidad. No se incluyen proyectos de riesgo, inciertos o no verificables. Los cambios de fuente detienen la aprobación. El proceso depende de GitHub; no se garantiza un plazo ni la inclusión. Las sugerencias se guardan de inmediato. La revisión programada procesa como máximo un proyecto nuevo por hora; la cola y GitHub pueden causar demoras. La breve descripción de la fuente debe estar en inglés. Si falla la revisión, edita la misma sugerencia para volver a ponerla en cola.\n\nHerramientas de desarrollo admitidas:\n- Formateadores de código\n- Analizadores de código fuente\n- Comprobadores de tipos\n- Compiladores\n\nLa inclusión se confirma solo después de publicar la página. Una tarea en la nube reintenta los fallos de publicación; no envíes duplicados."
      }
    },
    {
      "type": "input",
      "id": "project-name",
      "attributes": {
        "label": "Nombre del proyecto"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "official-url",
      "attributes": {
        "label": "URL oficial pública",
        "placeholder": "https://github.com/organization/project"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "reason",
      "attributes": {
        "label": "¿Por qué merece la pena conocer este proyecto?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "checkboxes",
      "id": "public-disclosure",
      "attributes": {
        "label": "Sugerir un proyecto públicamente",
        "options": [
          {
            "label": "Entiendo que mi identidad de GitHub y este contenido serán públicos y no he incluido datos personales, confidenciales ni de pago.",
            "required": true
          }
        ]
      }
    },
    {
      "type": "checkboxes",
      "id": "not-listed",
      "attributes": {
        "label": "Comprueba primero el directorio",
        "description": "https://gfy0.github.io/gfy0/es/discover/",
        "options": [
          {
            "label": "He buscado en el directorio y ninguno de los proyectos es este mismo proyecto.",
            "required": true
          }
        ]
      }
    }
  ]
}
