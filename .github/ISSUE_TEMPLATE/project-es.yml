{
  "name": "Sugerir un proyecto públicamente (es)",
  "description": "Sugiere un proyecto para el directorio gratuito. La identidad y el contenido son públicos.",
  "title": "[Project suggestion] ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Debes iniciar sesión en GitHub. Tu identidad de GitHub y tu sugerencia serán públicas. No incluyas datos personales, confidenciales ni de pago.\n\nSe crea una sugerencia pública para su consideración, no un envío anónimo ni un recibo privado. El envío no inicia una revisión inmediata ni garantiza la publicación. No se solicita ningún pago.\n\nGuarda la URL de la incidencia para consultar su estado abierto o cerrado y las respuestas. Puedes editarla en GitHub. Si el envío falla, comprueba primero si ya existe para evitar duplicados.\n\nUn acuse automático comprueba los campos obligatorios y las URL exactas ya presentes en el directorio. No es una aprobación de contenido. Edita esta misma sugerencia para actualizarlo.\n\nLas sugerencias se revisan en lotes limitados. Un resultado separado identifica la versión revisada y enlaza al proyecto si se publica. No se garantiza un plazo de respuesta ni la inclusión en el directorio."
      }
    },
    {
      "type": "input",
      "id": "project-name",
      "attributes": {
        "label": "Nombre del proyecto"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "official-url",
      "attributes": {
        "label": "URL oficial pública",
        "placeholder": "https://example.org/"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "reason",
      "attributes": {
        "label": "¿Por qué merece la pena conocer este proyecto?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "checkboxes",
      "id": "public-disclosure",
      "attributes": {
        "label": "Sugerir un proyecto públicamente",
        "options": [
          {
            "label": "Entiendo que mi identidad de GitHub y este contenido serán públicos y no he incluido datos personales, confidenciales ni de pago.",
            "required": true
          }
        ]
      }
    },
    {
      "type": "checkboxes",
      "id": "not-listed",
      "attributes": {
        "label": "Comprueba primero el directorio",
        "description": "https://gfy0.github.io/gfy0/es/discover/",
        "options": [
          {
            "label": "He buscado en el directorio y ninguno de los proyectos es este mismo proyecto.",
            "required": true
          }
        ]
      }
    }
  ]
}
