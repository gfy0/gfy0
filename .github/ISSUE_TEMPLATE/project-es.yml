{
  "name": "Sugerir un proyecto públicamente (es)",
  "description": "Sugiere un proyecto para el directorio gratuito. La identidad y el contenido son públicos.",
  "title": "[Project suggestion] ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Debes iniciar sesión en GitHub. Tu identidad de GitHub y tu sugerencia serán públicas. No incluyas datos personales, confidenciales ni de pago.\n\nEnviar o editar una sugerencia inicia las comprobaciones en la nube. Conserva el mismo registro para ver el resultado. No se cobra.\n\nLa revisión se ejecuta en la nube sin el ordenador del operador. Solo las fuentes previamente revisadas de abajo pueden añadirse automáticamente. Las demás reciben un resultado de no inclusión; no hay revisión general. Si cambia la versión revisada, se detiene la aprobación. Depende de la disponibilidad de GitHub, sin plazo garantizado.\n\nFuentes admitidas para inclusión automática:\n- ESLint: https://github.com/eslint/eslint\n- Prettier: https://github.com/prettier/prettier\n- TypeScript: https://github.com/microsoft/TypeScript\n\nLa inclusión se confirma solo después de publicar la página. Una tarea en la nube reintenta los fallos de publicación; no envíes duplicados."
      }
    },
    {
      "type": "input",
      "id": "project-name",
      "attributes": {
        "label": "Nombre del proyecto"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "official-url",
      "attributes": {
        "label": "URL oficial pública",
        "placeholder": "https://example.org/"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "reason",
      "attributes": {
        "label": "¿Por qué merece la pena conocer este proyecto?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "checkboxes",
      "id": "public-disclosure",
      "attributes": {
        "label": "Sugerir un proyecto públicamente",
        "options": [
          {
            "label": "Entiendo que mi identidad de GitHub y este contenido serán públicos y no he incluido datos personales, confidenciales ni de pago.",
            "required": true
          }
        ]
      }
    },
    {
      "type": "checkboxes",
      "id": "not-listed",
      "attributes": {
        "label": "Comprueba primero el directorio",
        "description": "https://gfy0.github.io/gfy0/es/discover/",
        "options": [
          {
            "label": "He buscado en el directorio y ninguno de los proyectos es este mismo proyecto.",
            "required": true
          }
        ]
      }
    }
  ]
}
