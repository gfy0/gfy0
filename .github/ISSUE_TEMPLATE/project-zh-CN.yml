{
  "name": "公开建议一个项目 (zh-CN)",
  "description": "为免费目录建议项目；身份和内容将公开。",
  "title": "[Project suggestion] ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "需要登录 GitHub。你的 GitHub 身份和建议内容会公开展示。请勿填写个人、机密或付款信息。\n\n提交或编辑投稿会启动云端核验。保存同一条记录即可查看结果，不收取费用。\n\n审核在云端运行，不依赖运营者电脑开机。新增项目自动收录目前仅覆盖下方逐项预审的来源；其他来源会得到未收录结果，暂不提供通用项目审核。已审核来源版本改变时会暂停自动放行。处理受 GitHub 可用性影响，不保证完成时限。\n\n可自动收录的来源:\n- ESLint: https://github.com/eslint/eslint\n- Prettier: https://github.com/prettier/prettier\n- TypeScript: https://github.com/microsoft/TypeScript\n\n项目页面发布成功后才会显示已收录。发布失败时由云端恢复任务重试，请勿重复投稿。"
      }
    },
    {
      "type": "input",
      "id": "project-name",
      "attributes": {
        "label": "项目名称"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "official-url",
      "attributes": {
        "label": "官方公开网址",
        "placeholder": "https://example.org/"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "reason",
      "attributes": {
        "label": "这个项目有什么值得了解的地方？"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "checkboxes",
      "id": "public-disclosure",
      "attributes": {
        "label": "公开建议一个项目",
        "options": [
          {
            "label": "我理解 GitHub 身份和本次内容会公开，且未填写个人、机密或付款信息。",
            "required": true
          }
        ]
      }
    },
    {
      "type": "checkboxes",
      "id": "not-listed",
      "attributes": {
        "label": "先检查目录",
        "description": "https://gfy0.github.io/gfy0/zh-CN/discover/",
        "options": [
          {
            "label": "我已搜索目录，目录中的项目都不是本次建议的同一项目。",
            "required": true
          }
        ]
      }
    }
  ]
}
