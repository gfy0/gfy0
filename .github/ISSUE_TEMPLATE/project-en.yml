{
  "name": "Suggest a project publicly (en)",
  "description": "Suggest a project for the free directory. Identity and content are public.",
  "title": "[Project suggestion] ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "GitHub sign-in is required. Your GitHub identity and suggestion will be public. Do not include personal, confidential or payment information.\n\nSubmitting or editing a suggestion starts cloud checks. Keep the same record to see the result; no payment is requested.\n\nCloud review runs without the operator’s computer. Automatic new listings currently cover only the exact pre-reviewed sources below. Other sources receive a not-listed result; general project review is not available. Changes to reviewed source versions pause automatic approval. Processing depends on GitHub availability; no completion time is guaranteed.\n\nEligible automatic sources:\n- ESLint: https://github.com/eslint/eslint\n- Prettier: https://github.com/prettier/prettier\n- TypeScript: https://github.com/microsoft/TypeScript\n\nThe project is listed only after its page is published. If publishing fails, a cloud recovery task retries; do not submit a duplicate."
      }
    },
    {
      "type": "input",
      "id": "project-name",
      "attributes": {
        "label": "Project name"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "official-url",
      "attributes": {
        "label": "Official public URL",
        "placeholder": "https://example.org/"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "reason",
      "attributes": {
        "label": "Why is this project worth discovering?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "checkboxes",
      "id": "public-disclosure",
      "attributes": {
        "label": "Suggest a project publicly",
        "options": [
          {
            "label": "I understand that my GitHub identity and this content will be public, and I have not included personal, confidential or payment information.",
            "required": true
          }
        ]
      }
    },
    {
      "type": "checkboxes",
      "id": "not-listed",
      "attributes": {
        "label": "Check the directory first",
        "description": "https://gfy0.github.io/gfy0/en/discover/",
        "options": [
          {
            "label": "I searched the directory and none of the listed projects is this project.",
            "required": true
          }
        ]
      }
    }
  ]
}
