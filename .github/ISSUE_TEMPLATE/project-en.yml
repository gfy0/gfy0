{
  "name": "Suggest a project publicly (en)",
  "description": "Suggest a project for the free directory. Identity and content are public.",
  "title": "[Project suggestion] ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "GitHub sign-in is required. Your GitHub identity and suggestion will be public. Do not include personal, confidential or payment information.\n\nSubmitting or editing a suggestion starts cloud checks. Keep the same record to see the result; no payment is requested.\n\nReview runs in the cloud without the operator’s computer. Suggest public GitHub repositories maintained by organizations with a supported open-source license. The complete README must be within 20,000 characters and include a short plain-text line naming the project and describing its purpose. Risky, uncertain or unverifiable projects are not listed. Source changes pause approval. Processing depends on GitHub availability; no completion time or listing is promised. Submissions are saved immediately. Scheduled cloud review processes at most one new project per hour; queues and GitHub delays can take longer. The short source description must be in English. If review fails, edit the same suggestion to queue it again.\n\nSupported development tools:\n- Code formatters\n- Source-code linters\n- Type checkers\n- Compilers\n\nThe project is listed only after its page is published. If publishing fails, a cloud recovery task retries; do not submit a duplicate."
      }
    },
    {
      "type": "input",
      "id": "project-name",
      "attributes": {
        "label": "Project name"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "official-url",
      "attributes": {
        "label": "Official public URL",
        "placeholder": "https://github.com/organization/project"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "reason",
      "attributes": {
        "label": "Why is this project worth discovering?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "checkboxes",
      "id": "public-disclosure",
      "attributes": {
        "label": "Suggest a project publicly",
        "options": [
          {
            "label": "I understand that my GitHub identity and this content will be public, and I have not included personal, confidential or payment information.",
            "required": true
          }
        ]
      }
    },
    {
      "type": "checkboxes",
      "id": "not-listed",
      "attributes": {
        "label": "Check the directory first",
        "description": "https://gfy0.github.io/gfy0/en/discover/",
        "options": [
          {
            "label": "I searched the directory and none of the listed projects is this project.",
            "required": true
          }
        ]
      }
    }
  ]
}
