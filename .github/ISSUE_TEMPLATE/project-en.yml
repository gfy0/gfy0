{
  "name": "Suggest a project publicly (en)",
  "description": "Suggest a project for the free directory. Identity and content are public.",
  "title": "[Project suggestion] ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "GitHub sign-in is required. Your GitHub identity and suggestion will be public. Do not include personal, confidential or payment information.\n\nThis creates a public suggestion for consideration, not an anonymous submission or private receipt. Submitting does not start an immediate review or guarantee publication. No payment is requested.\n\nKeep the issue URL to view its open or closed status and any response. You can edit your suggestion on GitHub. If submission fails, check your issues before trying again to avoid duplicates.\n\nAn automatic receipt checks required fields and exact source links already in the directory. It is not content approval. Edit this same suggestion to update the receipt.\n\nSuggestions are reviewed in limited batches. A separate review result will identify the reviewed version and, if listed, link to the project. No response time or listing is promised."
      }
    },
    {
      "type": "input",
      "id": "project-name",
      "attributes": {
        "label": "Project name"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "official-url",
      "attributes": {
        "label": "Official public URL",
        "placeholder": "https://example.org/"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "reason",
      "attributes": {
        "label": "Why is this project worth discovering?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "checkboxes",
      "id": "public-disclosure",
      "attributes": {
        "label": "Suggest a project publicly",
        "options": [
          {
            "label": "I understand that my GitHub identity and this content will be public, and I have not included personal, confidential or payment information.",
            "required": true
          }
        ]
      }
    },
    {
      "type": "checkboxes",
      "id": "not-listed",
      "attributes": {
        "label": "Check the directory first",
        "description": "https://gfy0.github.io/gfy0/en/discover/",
        "options": [
          {
            "label": "I searched the directory and none of the listed projects is this project.",
            "required": true
          }
        ]
      }
    }
  ]
}
